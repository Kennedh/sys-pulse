name: Instaladores e release

on:
  push:
    tags: ['v3.*']
    paths-ignore: ['**.md', 'docs/**', 'examples/validacao-modelos/**']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag existente para gerar e publicar
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            name: Windows-x64
          - runner: ubuntu-22.04
            name: Linux-x64
          - runner: macos-15
            name: macOS-arm64
          - runner: macos-15-intel
            name: macOS-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Dependências Qt no Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
      - name: Dependências Python
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Conferir versão da tag
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: python -c "import os; from modules.version import VERSION; assert os.environ['RELEASE_TAG'] == 'v' + VERSION"
      - name: Testes
        run: python -m pytest -q
      - name: Ferramentas Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/fetch_build_tools.py
      - name: Gerar instaladores
        run: python tools/build_release.py
      - name: Testar o pacote nativo
        run: python tools/validate_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: SysPulse-${{ matrix.name }}
          path: |
            dist/releases/*
            !dist/releases/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: SysPulse-*
          path: dist/releases
          merge-multiple: true
      - name: Checksums e publicação
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          python -c "from tools.build_release import checksums; from pathlib import Path; checksums(Path('dist/releases'))"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "SysPulse $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" dist/releases/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
